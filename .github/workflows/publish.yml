name: Publish to RubyGems

# Every push and pull request tests and builds the gem.
# Only a published GitHub release (or a manual run) pushes it to rubygems.org,
# through RubyGems trusted publishing: no password or API key is stored anywhere.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
      - name: Test
        run: ruby -w -Ilib -Itest test/test_unit.rb
      - name: Build the gem
        run: |
          gem build arionpay.gemspec
          ls -l *.gem
      - name: Release tag must match the gem version
        if: github.event_name == 'release'
        run: |
          version=$(ruby -Ilib -e 'require "arionpay/version"; print ArionPay::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: '*.gem'
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/arionpay
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.3'
      # Trusted publishing: swap this job's GitHub OIDC token for a push-only rubygems.org key
      # that expires after 15 minutes. "owner" names the rubygems.org account (immutable ID)
      # whose pending trusted publisher may create the gem; rubygems.org rejects a first push without it.
      - name: Get a short-lived RubyGems key
        env:
          RUBYGEMS_OWNER: '256090'
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::$jwt"
          resp=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}' |
            curl -sS -X POST -H 'Content-Type: application/json' --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          key=$(printf '%s' "$resp" | jq -r '.rubygems_api_key // empty')
          if [ -z "$key" ]; then
            echo "Token exchange refused: $(printf '%s' "$resp" | jq -c . 2>/dev/null || printf '%s' "$resp")"
            exit 1
          fi
          echo "::add-mask::$key"
          printf '%s' "$resp" | jq -c 'del(.rubygems_api_key)'
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Push to rubygems.org
        run: gem push arionpay-*.gem
